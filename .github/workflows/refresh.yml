name: Refresh F1 Fantasy Data

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend refresh
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${BACKEND_URL:-}" ]]; then
            echo "BACKEND_URL secret is missing"
            exit 1
          fi

          url="${BACKEND_URL%/}/api/admin/refresh-all"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          http_code="$(curl -sS -o "$body_file" -w '%{http_code}' -X POST --max-time 300 "$url" -H 'Content-Type: application/json')"
          cat "$body_file"
          echo
          echo "HTTP status: $http_code"

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            exit 1
          fi
